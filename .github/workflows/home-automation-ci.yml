name: Home Automation CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      live_eval:
        description: "Run live FoundationModel evaluation"
        required: false
        default: "false"

jobs:
  build-test-eval:
    runs-on: macos-26
    defaults:
      run:
        working-directory: HomeAutomationCore
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain diagnostics
        run: |
          swift --version
          xcodebuild -version
      - name: Swift build
        run: swift build
      - name: Select iOS Simulator
        id: simulator
        # Hosted runners are ephemeral, so a hardcoded simulator UDID never
        # exists. Pick the newest available iOS simulator (preferring iPad)
        # from whatever the runner image ships.
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys

          data = json.load(sys.stdin)["devices"]
          ios_runtimes = sorted(
              (r for r in data if "iOS" in r),
              reverse=True,
          )

          def first(predicate):
              for runtime in ios_runtimes:
                  for device in data[runtime]:
                      if device.get("isAvailable") and predicate(device):
                          return device
              return None

          device = first(lambda d: "iPad" in d["name"]) or first(lambda d: True)
          if device is None:
              sys.exit("No available iOS simulator on this runner")
          print(device["udid"])
          ')
          echo "Selected simulator UDID: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Swift test on iOS Simulator
        run: xcodebuild test -scheme HomeAutomationCore-Package -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}"
      - name: Deterministic evaluation
        run: swift run home-automation-eval --mode deterministic --suite all --output .build/evaluation
      - name: Upload deterministic evaluation artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deterministic-evaluation
          path: HomeAutomationCore/.build/evaluation

  live-eval:
    runs-on: macos-26
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.live_eval == 'true' }}
    defaults:
      run:
        working-directory: HomeAutomationCore
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain diagnostics
        run: |
          swift --version
          xcodebuild -version
      - name: Live FoundationModel evaluation
        env:
          HOME_AUTOMATION_EVAL_LIVE: "1"
        run: swift run home-automation-eval --mode live --suite all --require-live-model true --output .build/evaluation-live
      - name: Upload live evaluation artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-evaluation
          path: HomeAutomationCore/.build/evaluation-live
