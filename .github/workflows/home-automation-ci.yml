name: Home Automation CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      live_eval:
        description: "Run live FoundationModel evaluation"
        required: false
        default: "false"

jobs:
  build-test-eval:
    runs-on: macos-26
    defaults:
      run:
        working-directory: HomeAutomationCore
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain diagnostics
        run: |
          swift --version
          xcodebuild -version
      - name: Swift build
        run: swift build
      - name: Swift test on iOS Simulator (iPhone 17 Pro Max, iOS 26, Apple Intelligence enabled)
        run: xcodebuild test -scheme HomeAutomationCore-Package -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max,OS=26.1'
      - name: Deterministic evaluation
        run: swift run home-automation-eval --mode deterministic --suite all --output .build/evaluation
      - name: Upload deterministic evaluation artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deterministic-evaluation
          path: HomeAutomationCore/.build/evaluation

  live-eval:
    runs-on: macos-26
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.live_eval == 'true' }}
    defaults:
      run:
        working-directory: HomeAutomationCore
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain diagnostics
        run: |
          swift --version
          xcodebuild -version
      - name: Live FoundationModel evaluation
        env:
          HOME_AUTOMATION_EVAL_LIVE: "1"
        run: swift run home-automation-eval --mode live --suite all --require-live-model true --output .build/evaluation-live
      - name: Upload live evaluation artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-evaluation
          path: HomeAutomationCore/.build/evaluation-live
